<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TARO Bujo">
<title>TARO Bujo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4E0; --grid:#FBE3BC; --card:#FFFDF8; --ink:#2B1D12; --muted:#8A6E58; --line:#F2DFC4; --soft:#FFF0D6;
  --inc:#3382F8; --exp:#EA6101; --blue:#3382F8; --orange:#F99A00; --deep:#EA6101; --pink:#EA6101; --mint:#FDF89A; --green:#2E9E5B; --yellow:#FDF89A; --red:#E0362C; --lav:#9FC3FB;
  color-scheme:light;
  --shadow:0 1px 0 rgba(43,29,18,.04), 0 10px 28px -14px rgba(180,90,10,.35);
  --hand:"Londrina Solid", "Arial Rounded MT Bold", "Avenir Next", sans-serif;
  --ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --burst:polygon(50.0% 0.0%,56.7% 7.5%,65.5% 2.4%,69.5% 11.7%,79.4% 9.5%,80.4% 19.6%,90.5% 20.6%,88.3% 30.5%,97.6% 34.5%,92.5% 43.3%,100.0% 50.0%,92.5% 56.7%,97.6% 65.5%,88.3% 69.5%,90.5% 79.4%,80.4% 80.4%,79.4% 90.5%,69.5% 88.3%,65.5% 97.6%,56.7% 92.5%,50.0% 100.0%,43.3% 92.5%,34.5% 97.6%,30.5% 88.3%,20.6% 90.5%,19.6% 80.4%,9.5% 79.4%,11.7% 69.5%,2.4% 65.5%,7.5% 56.7%,0.0% 50.0%,7.5% 43.3%,2.4% 34.5%,11.7% 30.5%,9.5% 20.6%,19.6% 19.6%,20.6% 9.5%,30.5% 11.7%,34.5% 2.4%,43.3% 7.5%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default}
img,svg,canvas{-webkit-user-drag:none; -webkit-touch-callout:none}
.field.plan{resize:vertical; min-height:120px; font-family:ui-monospace,Menlo,monospace; font-size:13px; line-height:1.5}
.okn{color:#2E9E5B!important; font-weight:800}
.jtags{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px}
.tchip{background:color-mix(in srgb, var(--blue) 12%, transparent); color:var(--blue); border-radius:99px; padding:5px 11px; font-size:13px; font-weight:700; line-height:1.2}
.tchip.ghost{background:var(--soft); color:var(--muted)}
.field.tagin{width:110px; padding:5px 11px; font-size:13px; border-radius:99px}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px; background-attachment:fixed;
  color:var(--ink); font-family:var(--ui); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:8px}
.hand{font-family:var(--hand); font-weight:400}
.muted{color:var(--muted)}
.inc{color:var(--inc)} .exp{color:var(--exp)}

/* top bar */
.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.top .tl,.top .tr{display:flex; gap:8px; align-items:center}
.top .tr{margin-left:auto}
.ib{width:42px; height:42px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:grid; place-items:center; font-size:18px}
.mainnav{min-width:0; flex:0 1 auto; display:flex; gap:2px; background:var(--card); border-radius:99px; padding:4px; box-shadow:var(--shadow); overflow-x:auto; scrollbar-width:none}
.mainnav::-webkit-scrollbar{display:none}
.mainnav button{display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:99px; font-weight:700; font-size:14px; color:var(--muted); white-space:nowrap}
.mainnav button b{font-family:var(--hand); font-weight:400; font-size:15px; line-height:1; min-width:18px; text-align:center; font-variant-emoji:text}
.mainnav button.on{background:var(--blue); color:#fff}
.pill{white-space:nowrap; background:var(--card); box-shadow:var(--shadow); border-radius:99px; padding:9px 16px; font-weight:700; font-size:14px}
.strip{display:flex; align-items:baseline; gap:4px; padding:0 18px 4px; overflow-x:auto; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .yr{font-family:var(--hand); font-size:28px; margin-right:10px}
.strip button{padding:4px 9px; font-size:14px; color:var(--muted); font-weight:600; white-space:nowrap}
.strip button.on{color:var(--ink); background:linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 90%, transparent 90%)}

main{padding:10px 16px 60px; max-width:1400px; margin:0 auto}
.card{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:18px}
h1,h2,h3{margin:0}
.h2{font-family:var(--hand); font-weight:400; font-size:24px; line-height:1.2; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
.h2 small{font-family:var(--ui); font-size:13px; color:var(--muted)}
.empty{color:var(--muted); text-align:center; padding:14px 6px; font-size:14px}

/* form bits */
.field{width:100%; min-width:0; background:var(--soft); border:1.5px solid transparent; border-radius:14px; padding:11px 13px; font-size:15px}
.field:focus{border-color:var(--blue); outline:none; background:var(--card)}
select.field{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:32px}
.row{display:flex; gap:8px; align-items:center}
.row.wrap{flex-wrap:wrap}
.btn{background:var(--blue); color:#fff; border-radius:14px; padding:11px 16px; font-weight:800; white-space:nowrap}
.btn.ghost{background:var(--soft); color:var(--ink)}
.btn.warn{background:var(--soft); color:var(--red)}
.btn.orange{background:var(--orange); color:#fff}
.seg{display:flex; background:var(--soft); border-radius:14px; padding:3px; gap:2px}
.seg button{flex:1; padding:8px 10px; border-radius:11px; font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips button{background:var(--soft); border-radius:99px; padding:5px 12px; font-size:13px; font-weight:600}
.chips button.on{background:var(--blue); color:#fff}
.err{color:var(--red); font-size:13px; font-weight:600}
.hint{font-size:13px; color:var(--muted); line-height:1.5}
.bar{height:10px; background:var(--soft); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:99px; background:var(--orange); transition:width .4s ease}
.bar.thin{height:6px}
.tag{display:inline-flex; align-items:center; gap:4px; background:var(--soft); color:var(--muted); border-radius:99px; padding:1px 9px; font-size:12px; font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.burst{clip-path:var(--burst)}
.del{width:30px; height:30px; border-radius:10px; color:var(--muted); font-size:18px; flex:none}
.del:hover{background:var(--soft); color:var(--red)}

/* checkboxes */
.chk{width:26px; height:26px; flex:none; border-radius:9px; border:2px solid var(--line); display:grid; place-items:center; background:var(--card)}
.chk.on{background:var(--green); border-color:var(--green)}
.chk.on::after{content:""; width:11px; height:6px; border-left:2.5px solid #fff; border-bottom:2.5px solid #fff; transform:translateY(-1px) rotate(-45deg)}
.chk.round{border-radius:50%}

/* home */
.home h1{font-family:var(--hand); font-size:44px; line-height:1.1; margin:8px 2px 4px}
.home p.lead{margin:0 2px 20px; color:var(--muted)}
.folders{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px}
.folder{position:relative; text-align:left; background:var(--card); border-radius:8px 24px 24px 24px; box-shadow:var(--shadow); padding:18px; margin-top:16px; display:flex; flex-direction:column; gap:10px}
.folder::before{content:""; position:absolute; left:0; top:-16px; width:44%; height:20px; background:var(--card); border-radius:14px 14px 0 0}
.fcover{aspect-ratio:4/3; border-radius:16px; overflow:hidden; background:var(--soft)}
.fcover img{width:100%; height:100%; object-fit:cover; display:block}
.fbig{aspect-ratio:4/3; border-radius:16px; background:var(--orange); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.fbig b{font-family:var(--hand); font-weight:900; font-size:84px; letter-spacing:.01em}
.fbig span{font-family:var(--hand); font-size:20px; margin-top:10px; white-space:nowrap}
.frow{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.frow .fp{font-family:var(--hand); font-size:24px; color:var(--deep)}
.folder .mini{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; width:118px}
.folder .mini i{aspect-ratio:1; border-radius:7px; background:var(--soft)}
.folder .mini i.f{background:#CFE7FF} .folder .mini i.d{background:var(--mint)} .folder .mini i.c{background:var(--yellow)}
.folder b{font-family:var(--hand); font-weight:400; font-size:34px; line-height:1}
.folder .t{font-weight:700}
.folder.new{align-items:center; justify-content:center; min-height:260px; border:2.5px dashed var(--grid); background:color-mix(in srgb, var(--card) 60%, transparent); box-shadow:none; color:var(--muted); font-weight:800}
.folder.new::before{display:none}

/* year */
.yhead{display:flex; align-items:flex-end; gap:12px; margin:6px 2px 16px}
.yhead h1{font-family:var(--ui); font-weight:800; font-size:34px; line-height:1.1}
.cloud{display:inline-block; font-family:var(--hand); font-size:26px; background:var(--card); padding:2px 18px; border-radius:30px; box-shadow:var(--shadow)}
.year-layout{display:grid; gap:20px}
.bingo{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.cell{position:relative; aspect-ratio:1; border-radius:20px; background:var(--soft); border:2px dashed var(--line); padding:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; overflow:hidden}
.cell.has{background:var(--card); border:2px solid var(--line)}
.cell .gt{font-family:var(--ui); font-weight:700; font-size:14px; line-height:1.15; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.cell .pc{font-size:12px; font-weight:800; color:var(--muted)}
.cell .stk{width:44px; height:44px}
.cell .stk img,.cell .stk svg{width:100%; height:100%; object-fit:contain}
.cell .plus{color:var(--muted); font-weight:700; font-size:13px}
.cell.free{background:var(--yellow); border:0}
.cell.free span{font-family:var(--hand); font-size:30px; color:var(--deep)}
.cell.done{background:color-mix(in srgb, var(--mint) 45%, var(--card)); border-color:transparent}
.stamp{position:absolute; right:6px; top:6px; width:34px; height:34px; background:var(--pink); display:grid; place-items:center; transform:rotate(-12deg)}
.stamp::after{content:""; width:12px; height:7px; border-left:3px solid #fff; border-bottom:3px solid #fff; transform:translateY(-2px) rotate(-45deg)}
.cell.lined{box-shadow:inset 0 0 0 3px var(--blue)}
.status{display:flex; align-items:center; gap:12px; margin-top:16px}
.status .bar{flex:1; height:16px; box-shadow:inset 0 0 0 1.5px var(--line)}
.status .bar i{background:repeating-linear-gradient(-45deg, var(--deep) 0 8px, var(--orange) 8px 16px)}
.status .emo{font-size:18px; height:44px; padding:0 14px; display:grid; place-items:center; background:var(--soft); border-radius:99px; white-space:nowrap}
.statline{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-weight:700; margin-top:6px}
.mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.mcard{background:var(--soft); border-radius:18px; padding:12px; text-align:left; display:flex; flex-direction:column; gap:8px; min-height:96px}
.mcard b{font-family:var(--hand); font-weight:400; font-size:30px; line-height:1}
.mcard span{font-size:12px; color:var(--muted); font-weight:700}
.mcard.cur{background:var(--card); box-shadow:inset 0 0 0 2.5px var(--orange)}

/* month */
.month-layout{display:grid; gap:20px}
.calhead{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.calhead h1{font-family:var(--hand); font-weight:400; font-size:34px; line-height:1; flex:1}
.calhead h1 small{font-size:18px; color:var(--muted)}
.navb{width:38px; height:38px; border-radius:50%; background:var(--soft); font-size:20px; display:grid; place-items:center; flex:none}
.calgrid{display:grid; grid-template-columns:38px repeat(7,1fr); gap:4px}
.calgrid .wh{font-size:12px; font-weight:800; color:var(--muted); text-align:center; padding:4px 0}
.calgrid .wh.we{color:var(--red)}
.wkno{font-family:var(--hand); font-size:15px; color:var(--blue); background:color-mix(in srgb, var(--blue) 10%, transparent); border-radius:10px; display:grid; place-items:center}
.dcell{min-height:92px; border-radius:14px; background:var(--soft); padding:6px; text-align:left; display:flex; flex-direction:column; gap:3px; position:relative; overflow:hidden}
.dcell.out{opacity:.35}
.dcell .n{font-family:var(--hand); font-size:18px; line-height:1}
.dcell.today .n{background:var(--yellow); border-radius:99px; padding:0 6px; align-self:flex-start}
.dcell .md{position:absolute; right:4px; top:4px; width:26px; height:26px}
.dcell .md img,.dcell .md svg{width:100%; height:100%; object-fit:contain}
.dcell .info{margin-top:auto; font-size:11px; font-weight:800; line-height:1.3; font-variant-numeric:tabular-nums}
.dcell .td{color:var(--muted)}
.side{display:flex; flex-direction:column; gap:16px}
.msum{display:grid; grid-template-columns:repeat(3,1fr); background:var(--soft); border-radius:16px; padding:10px 0}
.msum div{padding:0 12px}
.msum div+div{border-left:1.5px solid var(--line)}
.msum span{display:block; font-size:12px; color:var(--muted); font-weight:700}
.msum b{font-size:16px; font-variant-numeric:tabular-nums}
.glist{display:flex; flex-direction:column}
.gitem{display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1.5px dashed var(--line)}
.gitem:last-child{border-bottom:0}
.gitem .gb{flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; gap:4px}
.gitem .gb b{font-weight:700; overflow-wrap:anywhere}
.gitem.done .gb b{color:var(--muted); text-decoration:line-through}
.gform{display:grid; gap:8px; margin-top:8px}
.alloc{flex-basis:100%; display:flex; gap:4px; padding-left:36px}
.alloc button{flex:1; min-width:0; padding:5px 0; border-radius:9px; background:var(--soft); font-size:11px; font-weight:800; color:var(--muted)}
.alloc button.on{background:var(--blue); color:#fff}
.alloc button.dn{background:var(--green); color:#fff}

/* habits */
.hwrap{overflow-x:auto; margin:0 -6px; padding:0 6px}
table.hab{border-collapse:separate; border-spacing:0}
.hab th{font-size:11px; color:var(--muted); font-weight:800; height:28px; min-width:30px}
.hab th.t{color:var(--ink); background:var(--yellow); border-radius:8px}
.hab .hn{position:sticky; left:0; z-index:1; background:var(--card); text-align:left; padding-right:12px; white-space:nowrap; font-weight:700; max-width:170px; overflow:hidden; text-overflow:ellipsis}
.hab .hn span{margin-right:6px}
.hab .cnt{font-size:12px; color:var(--muted); font-weight:800; padding-left:10px; white-space:nowrap}
.hdot{width:30px; height:36px; display:grid; place-items:center}
.hdot i{width:18px; height:18px; border-radius:50%; border:2px solid var(--line); display:block}
.hdot.on i{border:0; background:var(--pink); clip-path:var(--burst); width:22px; height:22px}
.emopick button{font-size:18px; padding:4px 8px}

/* week */
.weekhead{display:flex; align-items:center; gap:10px; margin:2px 2px 14px}
.weekhead h1{font-family:var(--hand); font-weight:400; font-size:32px; line-height:1}
.weekhead h1 small{font-size:17px; color:var(--muted); margin-left:8px}
.week-grid{display:grid; grid-template-columns:1fr; gap:0; background:var(--card); border-radius:24px; box-shadow:var(--shadow); overflow:hidden}
.wcell{padding:14px; border-bottom:1.5px dashed var(--line); min-height:220px; display:flex; flex-direction:column; gap:8px; min-width:0}
.wcell .dh{display:flex; align-items:center; gap:8px}
.wcell .dh button.d{display:flex; align-items:baseline; gap:6px}
.wcell .dh b{font-family:var(--hand); font-weight:400; font-size:24px; line-height:1}
.wcell .dh small{font-size:12px; font-weight:800; color:var(--muted)}
.wcell.today .dh b{background:var(--yellow); border-radius:99px; padding:1px 7px}
.wcell .mood{margin-left:auto; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:var(--line)}
.wcell .mood img,.wcell .mood svg{width:100%; height:100%; object-fit:contain}
.wtask{display:flex; align-items:flex-start; gap:8px; font-size:14px}
.wtask .chk{width:20px; height:20px; border-radius:50%}
.wtask .chk.on::after{width:8px; height:4px; border-width:2px}
.wtask.done span{color:var(--muted); text-decoration:line-through}
.wtask span{overflow-wrap:anywhere}
.wjr{font-size:13px; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden}
.inkprev{width:100%; height:90px; display:block}
.whab{display:flex; flex-wrap:wrap; gap:4px}
.whab span{font-size:14px; opacity:.25}
.whab span.on{opacity:1}
.qadd{margin-top:auto; background:transparent; border:0; border-top:1.5px dashed var(--line); padding:8px 2px 0; font-size:14px; width:100%}
.qadd:focus{outline:none; border-top-color:var(--blue)}
.minical{background:#FFE3B5; border-radius:16px; padding:10px; color:var(--ink)}
.minical .mt{font-family:var(--hand); font-size:18px; margin-bottom:4px}
.minical .g{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-size:11px; font-weight:800}
.minical .g span{padding:3px 0; border-radius:6px}
.minical .g .o{opacity:.35}
.minical .g .w{background:#F9C27A}
.minical .g .t{background:var(--yellow)}

/* day */
.day-layout{display:grid; gap:18px}
.dgrid{display:grid; gap:18px; align-items:stretch; min-width:0}
.dayhead{flex-wrap:wrap}
.daytitle{min-width:150px}
.dmoney{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:var(--card); box-shadow:var(--shadow); border-radius:24px; padding:10px 10px 10px 18px}
.dmt{display:flex; gap:20px; text-align:left}
.dmt small{display:block; font-size:12px; color:var(--muted); font-weight:700; line-height:1.3}
.dmt b{font-size:18px; font-variant-numeric:tabular-nums; line-height:1.3}
.addm{width:44px; height:44px; border-radius:50%; background:var(--blue); color:#fff; font-size:26px; line-height:1; flex:none}
.dtg{flex-basis:100%; display:flex; align-items:center; gap:8px; padding-right:8px}
.dtg .bar{flex:1}
.dtg small{font-size:12px; color:var(--muted); font-weight:800; white-space:nowrap}
.ycol{display:grid; gap:20px; align-content:start}
.yhab{display:flex; flex-wrap:wrap; gap:10px}
.hico{min-width:52px; height:52px; padding:0 12px; border-radius:26px; background:var(--soft); font-size:20px; white-space:nowrap; display:grid; place-items:center}
.hico.add{background:var(--blue); color:#fff; font-size:26px; width:52px; padding:0}
.gp{font-size:12px; font-weight:800; color:var(--muted); text-align:right; line-height:1.3}
.gp small{display:block; font-weight:700}
.subs{flex-basis:100%; padding-left:36px; display:flex; flex-direction:column; gap:6px}
.subt{align-self:flex-start; font-size:13px; font-weight:800; color:var(--blue); background:color-mix(in srgb, var(--blue) 12%, transparent); border-radius:99px; padding:4px 12px}
.stb{flex:1; min-width:0; display:flex; justify-content:space-between; gap:8px; text-align:left; font-size:14px}
.stb em{font-style:normal; font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap}
.wtask.done .stb span{color:var(--muted); text-decoration:line-through}
.subrow{display:flex; gap:6px; align-items:center}
.subrow .field{padding:8px 10px; font-size:14px}
.subrow .dt{width:auto; flex:none; max-width:150px}
.btn.sq{width:38px; height:38px; padding:0; font-size:22px; flex:none}
.jsum{margin:0 2px 8px; color:var(--muted); font-weight:700}
.jghead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:22px 2px 10px}
.jghead h2{font-size:28px; line-height:1.2}
.jghead span{font-size:13px; color:var(--muted); font-weight:700}
.htag{color:var(--blue); font-weight:700}
.swatches{display:flex; flex-wrap:wrap; gap:10px}
.swc{width:38px; height:38px; border-radius:50%; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}
.swc.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.swc.auto{background:var(--soft); font-weight:800; font-size:14px; color:var(--muted)}
.swc.custom{position:relative; overflow:hidden; cursor:pointer}
.swc.custom input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer}
.fprev{border-radius:16px; height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; margin-bottom:16px}
.fprev b{font-family:var(--hand); font-weight:900; font-size:56px}
.fprev span{font-family:var(--hand); font-size:18px; margin-top:8px}
.dtarget{background:var(--soft); border-radius:14px; padding:10px 12px; margin-bottom:10px}
.dtarget .r{display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px}
.dtarget b{color:var(--ink)} .over{color:var(--red)!important}
.money-top{display:grid; gap:18px}
.dl{display:block; font-size:12px; font-weight:800; color:var(--muted); margin-top:2px}
.dl.up{color:var(--inc)} .dl.bad{color:var(--red)}
.bhead{display:grid; grid-template-columns:1fr 1fr; margin-bottom:10px}
.bhead span,.bgoal span{display:block; font-size:12px; color:var(--muted); font-weight:700}
.bhead b{font-size:22px; font-variant-numeric:tabular-nums}
.bar.big{height:14px}
.bgoal{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.bgoal div{background:var(--soft); border-radius:14px; padding:10px 12px}
.bgoal b{font-size:18px; font-variant-numeric:tabular-nums}
.h2 .tag{font-family:var(--ui)}
/* journal tab */
.jm{font-size:28px; margin:22px 2px 10px}
.jgrid{display:grid; gap:16px}
.jentry{display:flex; flex-direction:column; gap:10px}
.jd{display:flex; align-items:center; gap:12px; text-align:left}
.jd b{font-family:var(--hand); font-size:44px; line-height:1; color:var(--deep); min-width:52px}
.jd span{font-weight:800; line-height:1.2}
.jd small{font-weight:600; color:var(--muted)}
.jmood{margin-left:auto; width:40px; height:40px; display:block}
.jmood img,.jmood svg{width:100%; height:100%; object-fit:contain}
.jt{margin:0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6}
.inkprev.big{height:180px}
/* tasks tab */
.tcols{display:grid; gap:18px; align-items:start}
.tree{padding:10px 14px}
.tn{border-bottom:1.5px dashed var(--line)}
.tn:last-child{border-bottom:0}
.tn .tn{border-bottom:0}
.tnh{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:10px 0}
.tnh i{font-style:normal; width:16px; color:var(--muted)}
.tnh b{flex:1; min-width:0; font-weight:700; overflow-wrap:anywhere}
.tnh b em{font-style:normal; color:var(--blue); font-weight:800; font-size:12px}
.tnh span{font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap}
.tn.d0>.tnh b{font-family:var(--hand); font-weight:400; font-size:24px}
.tnb{padding-left:22px}
/* mood tab */
.mood-layout{display:grid; gap:18px; align-items:start}
.habits-top{display:grid; gap:18px; align-items:stretch; margin-bottom:18px}
.hstat{display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1.5px dashed var(--line)}
.hstat:last-child{border-bottom:0}
.hstat .r{display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:14px}
.hstat .r span{color:var(--muted); font-weight:700; font-size:12px; white-space:nowrap}
.hico.sm{min-width:40px; height:40px; font-size:16px; padding:0 8px; flex:none}
.mgridy{display:grid; grid-template-columns:26px repeat(12,1fr); gap:3px; overflow-x:auto}
.mgridy .mh{text-align:center; font-family:var(--hand); font-size:18px; color:var(--deep)}
.mgridy .dn{font-size:11px; font-weight:800; color:var(--muted); display:grid; place-items:center}
.mc{aspect-ratio:1; min-width:20px; border-radius:7px; background:var(--soft); display:grid; place-items:center; padding:1px}
.mc img,.mc svg{width:100%; height:100%; object-fit:contain}
.mc.x{background:transparent}
.mc.t{box-shadow:inset 0 0 0 2px var(--blue)}
.mstat{display:flex; align-items:center; gap:12px; padding:8px 0}
.mstat>i{width:34px; height:34px; flex:none; display:block}
.mstat>i img,.mstat>i svg{width:100%; height:100%; object-fit:contain}
.mstat .r{display:flex; justify-content:space-between; font-size:14px; font-weight:700; margin-bottom:5px}
.mstat .r span:last-child{color:var(--muted)}
.dayhead{display:flex; align-items:center; gap:12px}
.datebub{width:96px; height:96px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.datebub b{font-family:var(--hand); font-weight:400; font-size:40px}
.datebub span{font-size:12px; font-weight:800; color:var(--muted); margin-top:3px}
.daytitle{flex:1}
.daytitle h1{font-family:var(--hand); font-weight:400; font-size:30px; line-height:1.1}
.daytitle p{margin:2px 0 0; color:var(--muted); font-weight:600; font-size:14px}
.moodbig{width:96px; height:96px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:grid; place-items:center; flex:none; overflow:hidden}
.moodbig img,.moodbig svg{width:78%; height:78%; object-fit:contain}
.moodbig .ph{font-family:var(--hand); font-size:16px; color:var(--muted); text-align:center; line-height:1.1}
.task{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1.5px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .tb{flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; gap:4px}
.task .tb>span:first-child{font-size:16px; overflow-wrap:anywhere}
.task.done .tb>span:first-child{color:var(--muted); text-decoration:line-through}
.task .from{font-size:12px; color:var(--muted)}
.money .split{position:relative; display:grid; grid-template-columns:1fr 1fr; background:var(--soft); border-radius:18px; overflow:hidden; margin-bottom:12px}
.money .split div{padding:14px 16px}
.money .split div:last-child{text-align:right}
.money .split span{font-family:var(--hand); font-size:18px; color:var(--muted); display:block}
.money .split b{font-size:19px; font-variant-numeric:tabular-nums}
.money .split::after{content:""; position:absolute; inset:0; background:linear-gradient(to top right, transparent calc(50% - 1px), var(--line) calc(50% - 1px), var(--line) calc(50% + 1px), transparent calc(50% + 1px))}
.tx{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1.5px dashed var(--line)}
.tx:last-child{border-bottom:0}
.tx .meta{flex:1; min-width:0}
.tx .meta b{display:block; font-weight:700; overflow-wrap:anywhere}
.tx .meta span{font-size:12px; color:var(--muted)}
.tx .amt{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
.dhab{display:flex; flex-direction:column; gap:2px}
.dhab button{display:flex; align-items:center; gap:12px; padding:8px 4px; border-radius:12px; text-align:left; font-weight:700}
.dhab button:hover{background:var(--soft)}
.dhab .bd{width:30px; height:30px; display:grid; place-items:center; flex:none; background:var(--soft); border-radius:50%; font-size:16px}
.dhab .on .bd{background:var(--pink); clip-path:var(--burst); width:34px; height:34px}
.journal .jbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px}
.journal .jbar .seg{flex:none}
.tools{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.tools .sw{width:26px; height:26px; border-radius:50%; border:3px solid var(--card); box-shadow:0 0 0 1.5px var(--line)}
.tools .sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.tools .tb{padding:6px 10px; border-radius:10px; background:var(--soft); font-size:13px; font-weight:800}
.tools .tb.on{background:var(--ink); color:var(--card)}
.paper{position:relative; height:560px; border-radius:18px; overflow:hidden;
  background-color:var(--card);
  background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% 32px; background-position:0 14px}
.paper textarea{position:absolute; inset:0; width:100%; height:100%; resize:none; border:0; background:transparent; padding:14px 16px; font-family:var(--ui); font-size:16px; line-height:32px; outline:none; z-index:1}
.paper canvas{position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; touch-action:auto}
.paper.pen canvas{pointer-events:auto; touch-action:none}
.paper.pen textarea{pointer-events:none}

/* money dashboard */
.dash{display:grid; gap:18px}
.stats{display:grid; grid-template-columns:repeat(3,1fr)}
.stats div{padding:0 16px}
.stats div+div{border-left:1.5px solid var(--line)}
.stats span{font-size:13px; color:var(--muted); font-weight:700; display:block}
.stats b{font-size:22px; font-variant-numeric:tabular-nums}
.chart svg{width:100%; height:auto; display:block}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); font-weight:700}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.catbar{padding:7px 0}
.catbar .r{display:flex; justify-content:space-between; font-size:14px; font-weight:600}
.catbar .r span:last-child{color:var(--muted); font-variant-numeric:tabular-nums}
.catbar .bar{margin-top:5px; height:8px}

/* modal */
.ov{position:fixed; inset:0; z-index:50; background:rgba(16,24,35,.35); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card); border-radius:26px; width:100%; max-width:520px; max-height:85vh; overflow:auto; padding:20px; box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.sheet .sh{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
.sheet .sh h3{font-family:var(--hand); font-weight:400; font-size:26px}
.sheet .grp{display:grid; gap:10px; margin-bottom:16px}
.sheet .lbl{font-size:13px; font-weight:800; color:var(--muted)}
.stkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px}
.stkgrid .stkitem{position:relative; aspect-ratio:1; border-radius:16px; background:var(--soft); display:grid; place-items:center; padding:8px; cursor:pointer}
.stkgrid .stkitem img{width:100%; height:100%; object-fit:contain}
.stkgrid button{position:relative; aspect-ratio:1; border-radius:16px; background:var(--soft); display:grid; place-items:center; padding:8px}
.stkgrid button.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.stkgrid img,.stkgrid svg{width:100%; height:100%; object-fit:contain}
.stkgrid .x{position:absolute; right:-4px; top:-4px; width:22px; height:22px; border-radius:50%; background:var(--red); color:#fff; font-size:13px; line-height:22px; padding:0}
.stkgrid small{position:absolute; bottom:2px; left:0; right:0; font-size:10px; font-weight:800; color:var(--muted)}
.ib{position:relative}
.cdot{position:absolute; right:2px; top:2px; width:11px; height:11px; border-radius:50%; border:2px solid var(--card); background:var(--line)}
.cdot.s-synced{background:#2E9E5B} .cdot.s-syncing{background:var(--orange)} .cdot.s-error{background:var(--red)}
.acct{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--soft); border-radius:16px; padding:12px 14px}
.acct b{overflow-wrap:anywhere}
.cstat{font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap}
.cstat.s-synced{color:#2E9E5B} .cstat.s-error{color:var(--red)}
.sw-toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--soft); border-radius:16px; padding:12px 14px; text-align:left; width:100%}
.sw-toggle i{width:46px; height:28px; border-radius:99px; background:var(--line); position:relative; flex:none; transition:background .2s}
.sw-toggle i::after{content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-toggle.on i{background:var(--green)}
.sw-toggle.on i::after{transform:translateX(18px)}
.sw-toggle b{display:block}
.sw-toggle span{font-size:13px; color:var(--muted)}

/* celebrate */
.cel{position:fixed; inset:0; z-index:60; background:rgba(16,24,35,.45); display:grid; place-items:center; padding:20px; overflow:hidden}
.cel .box{background:var(--card); border-radius:30px; padding:30px 26px; text-align:center; max-width:380px; width:100%; position:relative; z-index:1; animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.cel .badge{width:130px; height:130px; margin:0 auto 14px; background:var(--orange); display:grid; place-items:center; font-size:56px; animation:spin 6s linear infinite}
.cel .badge span{animation:spin 6s linear infinite reverse}
.cel h2{font-family:var(--hand); font-weight:400; font-size:46px; line-height:1}
.cel p{color:var(--muted); margin:8px 0 18px}
.conf{position:absolute; top:-20px; width:10px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.6); opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .conf{display:none} .cel .box,.cel .badge,.cel .badge span{animation:none} .bar i{transition:none}
}
.foot{text-align:center; color:var(--muted); font-size:12px; margin-top:28px}

/* responsive: tablet portrait */
@media (min-width:700px){
  .year-layout{grid-template-columns:1fr 1fr; align-items:start}
  .month-layout{grid-template-columns:1fr 1fr}
  .month-layout .cal{grid-column:1 / -1}
  .month-layout .habits{grid-column:1 / -1}
  .week-grid{grid-template-columns:1fr 1fr}
  .wcell{border-right:1.5px dashed var(--line)}
  .wcell:nth-child(2n){border-right:0}
  .dgrid{grid-template-columns:1fr 1fr}
  .money-top{grid-template-columns:1fr 1fr; align-items:stretch}
  .tcols{grid-template-columns:1fr 1fr}
  .jgrid{grid-template-columns:1fr 1fr}
  .habits-top{grid-template-columns:1fr 1fr}
  .ov{align-items:center}
}
/* iPad landscape */
@media (min-width:1050px){
  .year-layout{grid-template-columns:minmax(420px,1.1fr) 1fr}
  .month-layout{grid-template-columns:1.9fr 1fr}
  .month-layout .cal{grid-column:auto}
  .dcell{min-height:104px}
  .week-grid{grid-template-columns:repeat(4,1fr)}
  .wcell{border-right:1.5px dashed var(--line); min-height:300px}
  .wcell:nth-child(2n){border-right:1.5px dashed var(--line)}
  .wcell:nth-child(4n){border-right:0}
  .wcell:nth-child(n+5){border-bottom:0}
  .dgrid{grid-template-columns:1fr 1fr}
  .mood-layout{grid-template-columns:1.5fr 1fr}
  .paper{height:600px}
}
@media (max-width:699px){ .dmoney{order:10; width:100%} }
@media (max-width:520px){
  .top{padding:8px 10px; gap:6px}
  .pill{padding:9px 11px; font-size:13px}
  .mainnav button{padding:7px 10px}
  .mainnav button .lb{display:none}
  .calgrid{grid-template-columns:26px repeat(7,1fr); gap:3px}
  .dcell{min-height:64px; padding:4px; border-radius:10px}
  .dcell .md{width:18px; height:18px}
  .dcell .info{font-size:9.5px}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .datebub,.moodbig{width:78px; height:78px}
  .datebub b{font-size:32px}
  .paper{height:440px}
}
/* ---- skins ---- */
.skins{display:flex; gap:10px}
.skin{flex:1; display:flex; align-items:center; gap:10px; background:var(--soft); border-radius:16px; padding:10px 12px; font-weight:800}
.skin i{width:28px; height:28px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}
.skin.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
:root[data-skin="matcha"]{
  --bg:#F4F7E4; --grid:#E1E9B9; --card:#FFFEF7; --ink:#3B4512; --muted:#858C55; --line:#E1E6BF; --soft:#F2F5DA;
  --inc:#5E8F1A; --exp:#D9821A; --blue:#7FA01C; --orange:#F0C53E; --deep:#B9781A; --pink:#9DBB2E; --mint:#F6EC8C; --green:#5E8F1A; --yellow:#F6E97A; --red:#D9452B;
  --shadow:0 1px 0 rgba(59,69,18,.04), 0 10px 26px -14px rgba(110,130,20,.4);
}
:root[data-skin="matcha"] body{background-image:radial-gradient(var(--grid) 1.7px, transparent 2px); background-size:20px 20px}
:root[data-skin="matcha"] .card,:root[data-skin="matcha"] .folder,:root[data-skin="matcha"] .week-grid{border:2px dashed #D3DD94}
:root[data-skin="matcha"] .top{background-color:#FFF8D6; background-image:linear-gradient(90deg, rgba(240,197,62,.28) 50%, transparent 50%), linear-gradient(rgba(240,197,62,.28) 50%, transparent 50%); background-size:28px 28px}
:root[data-skin="matcha"] .minical{background:#EEF3C8}
:root[data-skin="matcha"] .minical .g .w,:root[data-skin="matcha"] .minical .g button.w{background:#D6E39A}
:root[data-skin="matcha"] .cell.free span{color:#8A6A10}
:root[data-skin="matcha"] .status .bar i{background:repeating-linear-gradient(-45deg, #9DBB2E 0 8px, #B8D25A 8px 16px)}
:root[data-skin="matcha"] .bar i{background:#9DBB2E}
:root[data-skin="matcha"] .hico,:root[data-skin="matcha"] .chk{border-color:#D3DD94}
:root[data-skin="matcha"] .ib,:root[data-skin="matcha"] .pill,:root[data-skin="matcha"] .navb{border:2px dashed #D3DD94}
/* ---- in-app notifications ---- */
.bell{position:relative}
.bdot{position:absolute; top:-2px; right:-2px; min-width:18px; height:18px; padding:0 4px; border-radius:99px; background:var(--red); color:#fff; font-style:normal; font-size:11px; font-weight:800; line-height:18px; text-align:center; border:2px solid var(--card)}
.inb{display:flex; gap:10px; width:100%; text-align:left; background:var(--soft); border-radius:14px; padding:10px 12px; align-items:flex-start}
.inb.new{background:color-mix(in srgb, var(--yellow) 55%, var(--card))}
.inb .ik{flex:none; font-size:11px; font-weight:800; color:#fff; background:var(--deep); border-radius:99px; padding:2px 8px; margin-top:2px}
.inb .it{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.inb .it span{font-size:14px; color:var(--ink)}
.inb .it small{font-size:12px; color:var(--muted)}
#toast{position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top,0px)); transform:translate(-50%,-150%); z-index:70; width:min(92vw,420px); transition:transform .3s ease}
#toast.show{transform:translate(-50%,0)}
#toast .tbox{display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; background:var(--card); border-radius:18px; padding:12px 16px; box-shadow:0 14px 34px -10px rgba(120,60,0,.45); border-left:5px solid var(--red)}
#toast .tbox b{font-size:15px} #toast .tbox span{font-size:13px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
/* ---- plus buttons ---- */
.h2 .ht{display:flex; align-items:center; gap:10px; min-width:0}
.hplus{width:30px; height:30px; flex:none; border-radius:50%; background:var(--blue); color:#fff; font-family:var(--ui); font-size:20px; font-weight:700; line-height:1; display:grid; place-items:center}
.hplus.sm{width:24px; height:24px; font-size:16px}
.subh{display:flex; align-items:center; gap:8px}
.wcell .dh .hplus.sm{margin-left:auto}
.wcell .dh .hplus.sm + .mood{margin-left:6px}
/* ---- mobile polish ---- */

<script>
(function(){
"use strict";
/* ================= utils ================= */
var pad=function(n){return (n<10?"0":"")+n};
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+(p[2]||1))}
function today(){return ds(new Date())}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function daysIn(ym){var p=ym.split("-");return new Date(+p[0],+p[1],0).getDate()}
function shiftMonth(ym,n){var p=ym.split("-");var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function monday(s){var d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)}
function isoWeek(s){var d=pd(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function vnd(n){return Math.round(n).toLocaleString("vi-VN")+"₫"}
function shortV(n){var a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1).replace(".0","")+"B";
  if(a>=1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(".0","")+"M";
  if(a>=1e3) return Math.round(n/1e3)+"k"; return String(Math.round(n));}
function parseAmt(s){s=String(s||"").trim().toLowerCase().replace(/\s|₫|đ|vnd/g,"");
  var m=s.match(/^([\d.,]+)(k|tr|m|b|ty|tỷ)?$/); if(!m) return NaN;
  if(m[2]){var v=parseFloat(m[1].replace(",","."));return Math.round(v*(m[2]==="k"?1e3:(m[2]==="tr"||m[2]==="m")?1e6:1e9))}
  return parseInt(m[1].replace(/[.,]/g,""),10);}
var WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var WD2=["Mo","Tu","We","Th","Fr","Sa","Su"];
var MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MF=["January","February","March","April","May","June","July","August","September","October","November","December"];
var WDF=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function wdShort(s){return WD[(pd(s).getDay()+6)%7].toUpperCase()}
function dm(s){var d=pd(s);return d.getDate()+"/"+(d.getMonth()+1)}
var CATS={out:["Ăn uống","Đi lại","Mua sắm","Hóa đơn","Nhà cửa","Giải trí","Sức khỏe","Học tập","Quà tặng","Khác"],"in":["Lương","Freelance","Thưởng","Bán hàng","Được cho","Khác"]};
var CAT_COLORS=["#EE5257","#FF7A1A","#E8B21C","#5CB85C","#2BB3B3","#2F8FE8","#7C67D6","#E066B5","#9C7B5B","#8A94A6"];
var HAB_EMO=["𝄞","಄","✿","☆","࣪ ִֶָ☾.","✈︎",".𖥔 ݁ ˖"];
var STATUS_EMO=["🌱","🌿","🌷","🌻","🏆"];

/* ================= storage (IndexedDB, fallback localStorage) ================= */
var KV=(function(){
  var dbp=null;
  function open(){ if(dbp) return dbp;
    dbp=new Promise(function(res,rej){ try{ var r=indexedDB.open("so-bingo",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("kv")};
      r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)} }); return dbp; }
  function run(mode,fn){ return open().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction("kv",mode), req=fn(t.objectStore("kv"));
    t.oncomplete=function(){res(req&&("result" in req)?req.result:undefined)}; t.onerror=function(){rej(t.error)}; }); }); }
  function lsGet(k){try{var v=localStorage.getItem("sb:"+k);return v?JSON.parse(v):undefined}catch(e){return undefined}}
  return {
    get:function(k){return run("readonly",function(s){return s.get(k)}).catch(function(){return lsGet(k)})},
    set:function(k,v){return run("readwrite",function(s){return s.put(v,k)}).catch(function(){try{localStorage.setItem("sb:"+k,JSON.stringify(v))}catch(e){}})},
    del:function(k){return run("readwrite",function(s){return s.delete(k)}).catch(function(){try{localStorage.removeItem("sb:"+k)}catch(e){}})},
    keys:function(){return run("readonly",function(s){return s.getAllKeys()}).catch(function(){var r=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("sb:")===0)r.push(k.slice(3))}}catch(e){}return r})}
  };
})();

/* ================= data ================= */
function DEF(){return {v:1,budgets:{},yhabits:{},jtags:{},inbox:[],nstate:{},settings:{requireGoal:false},boards:{},goals:{},tasks:{},tx:{},moods:{},habits:{},habitLog:{},journal:{}}}
var D=DEF(), STK=[], INK={};

function save(){clearTimeout(saveT); saveT=setTimeout(function(){KV.set("state",D)},250); if(window.cloudTouchRef) window.cloudTouchRef()}
function saveStk(){KV.set("stickers",STK); if(window.cloudTouchRef) window.cloudTouchRef()}
var inkT={};
function saveInk(date){clearTimeout(inkT[date]); inkT[date]=setTimeout(function(){
  if(INK[date]&&INK[date].length) KV.set("ink:"+date,INK[date]); else KV.del("ink:"+date); if(window.cloudTouchRef) window.cloudTouchRef();},400)}

var U={view:"home", year:new Date().getFullYear(), ym:today().slice(0,7), wk:monday(today()), day:today(),
  modal:null, hym:today().slice(0,7), range:"month", tmode:"progress", open:{}, myear:new Date().getFullYear(), editBudget:false, sel:-1, txKind:"out", txCat:"Ăn uống", err:"", jmode:"text", pen:"#1D2433", penW:3, tool:"pen",
  habEmo:"𝄞", jgroup:"month", confirm:null, celebrate:null, stkTarget:null};

/* ================= goal logic ================= */
var memo={};
function goalsBy(f){var r=[];for(var k in D.goals){if(f(D.goals[k]))r.push(D.goals[k])}return r.sort(function(a,b){return (a.created||0)-(b.created||0)})}
function tasksOf(f){var r=[];for(var k in D.tasks){if(f(D.tasks[k]))r.push(D.tasks[k])}return r.sort(function(a,b){return (a.created||0)-(b.created||0)})}
function descIds(id){var out=[id], q=[id]; while(q.length){var cur=q.pop(); for(var k in D.goals){if(D.goals[k].parentId===cur){out.push(k); q.push(k)}}} return out}
function taskCount(id){var ids=descIds(id), dn=0, tot=0; for(var k in D.tasks){var t=D.tasks[k]; if(t.goalId&&ids.indexOf(t.goalId)>-1){tot++; if(t.done) dn++}} return [dn,tot]}
function prog(id){
  if(id in memo) return memo[id];
  var g=D.goals[id], v=0;
  if(!g) v=0; else if(g.done) v=1;
  else { var c=taskCount(id);
    if(c[1]) v=c[0]/c[1];
    else { var kids=goalsBy(function(x){return x.parentId===id}); v=kids.length?kids.filter(function(x){return x.done}).length/kids.length:0 } }
  memo[id]=v; return v;
}
function pct(v){return Math.round(v*100)}
function yearGoals(y){var b=D.boards[y]; if(!b) return []; return b.cells.filter(function(id,i){return i!==4&&id&&D.goals[id]}).map(function(id){return D.goals[id]})}
function monthGoals(ym){return goalsBy(function(g){return g.level==="month"&&g.ym===ym})}
function weekGoals(wk){return goalsBy(function(g){return g.level==="week"&&g.wk===wk})}
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function cellDone(b,i){ if(i===4) return true; var id=b.cells[i]; return !!(id&&D.goals[id]&&prog(id)>=1) }
function boardLines(b){return LINES.map(function(l,i){return l.every(function(c){return cellDone(b,c)})?i:-1}).filter(function(i){return i>-1})}
function boardProg(b){var ids=b.cells.filter(function(id,i){return i!==4&&id&&D.goals[id]}); if(!ids.length) return 0; return ids.reduce(function(a,id){return a+prog(id)},0)/8}
function checkBingo(){
  memo={};
  Object.keys(D.boards).forEach(function(y){var b=D.boards[y]; b.celebrated=b.celebrated||[];
    var now=boardLines(b), fresh=now.filter(function(i){return b.celebrated.indexOf(i)<0});
    b.celebrated=b.celebrated.filter(function(i){return now.indexOf(i)>-1}).concat(fresh);
    if(fresh.length){U.celebrate={year:y, n:now.length}; U.modal=null}
  });
}
function goalLabel(g){return g?g.title:""}
function deleteGoal(id){
  Object.keys(D.goals).forEach(function(k){if(D.goals[k].parentId===id) D.goals[k].parentId=null});
  Object.keys(D.tasks).forEach(function(k){if(D.tasks[k].goalId===id) D.tasks[k].goalId=null});
  Object.keys(D.boards).forEach(function(y){var b=D.boards[y]; b.cells=b.cells.map(function(c){return c===id?null:c})});
  delete D.goals[id];
}

function stk(ref){
  if(!ref) return "";
  if(ref.indexOf("m:")===0) return moodSVG(ref);
  if(ref.indexOf("u:")===0){var s=STK.filter(function(x){return "u:"+x.id===ref})[0]; return s?'<img src="'+s.data+'" alt="">':""}

}

  STK.forEach(function(s){h+='<button data-act="'+act+'" data-v="u:'+s.id+'"'+(extra||"")+' class="'+(cur==="u:"+s.id?"on":"")+'" aria-label="Sticker"><img src="'+s.data+'" alt=""></button>'});
  return h+'</div>';
}

function words(t){t=(t||"").trim(); return t?t.split(/\s+/).length:0}
function dayTags(d){var r=(D.jtags[d]||[]).slice(); tagsOf(D.journal[d]).forEach(function(k){if(r.indexOf(k)<0) r.push(k)}); return r}
function usedTags(){var c={}; Object.keys(D.jtags).forEach(function(d){(D.jtags[d]||[]).forEach(function(k){c[k]=(c[k]||0)+1})}); Object.keys(D.journal).forEach(function(d){tagsOf(D.journal[d]).forEach(function(k){c[k]=(c[k]||0)+1})}); return Object.keys(c).sort(function(a,b){return c[b]-c[a]})}
function tagsOf(t){var r=[],m,re=/#([\p{L}\p{N}_]+)/gu; while((m=re.exec(t||""))) {var k=m[1].toLowerCase(); if(r.indexOf(k)<0) r.push(k)} return r}

function renderTop(){
  var nav=[["year","365","Year"],["month","31","Month"],["week","7","Week"],["day","1","Day"],["money","₫","Money"],["habits","✿","Habits"],["tasks","✓","Tasks"],["journal","✎","Journal"],["mood","☺︎","Mood"]];

    '<div class="tr"><button class="ib bell" data-act="modal" data-v="inbox" aria-label="Notifications">'+BELL_SVG+(unreadN()?'<i class="bdot">'+(unreadN()>9?"9+":unreadN())+'</i>':'')+'</button><button class="pill" data-act="today">Today</button><button class="ib" data-act="modal" data-v="settings" aria-label="Settings">⚙︎'+(Cloud.on?'<i class="cdot s-'+Cloud.status+'"></i>':'')+'</button></div>';
  var nv=document.querySelector(".mainnav"), on=nv&&nv.querySelector("button.on"); if(on&&nv.scrollWidth>nv.clientWidth) nv.scrollLeft=on.offsetLeft-nv.clientWidth/2+on.clientWidth/2;
  var st=document.getElementById("strip");
  var ctx={year:String(U.year)+"-00",month:U.ym,week:addDays(U.wk,3).slice(0,7),day:U.day.slice(0,7)}[U.view];
  if(!ctx){st.innerHTML="";return}
  var y=ctx.slice(0,4), cm=ctx.slice(5,7), h='<button class="yr" data-act="openYear" data-v="'+y+'">'+y+'</button>';
  for(var m=1;m<=12;m++) h+='<button data-act="openMonth" data-v="'+y+'-'+pad(m)+'" class="'+(pad(m)===cm?"on":"")+'">'+MS[m-1]+'</button>';

function vHome(){
  var ys=Object.keys(D.boards).sort(function(a,b){return b-a});
  var h='<section class="home"><h1>My vision board</h1><div class="folders">';
  ys.forEach(function(y){var b=D.boards[y], p=pct(boardProg(b)), col=b.color||"#F99A00", tc=b.tcolor||(isLight(col)?"#2B1D12":"#fff");
    h+='<button class="folder" data-act="openYear" data-v="'+y+'">'+(b.cover?'<div class="fcover"><img src="'+b.cover+'" alt=""></div>':'<div class="fbig" style="background:'+col+';color:'+tc+'"><b>'+y+'</b><span>'+p+'% goals done</span></div>')+
      '<div class="frow"><span class="t">'+esc(b.title)+'</span>'+(b.cover?'<span class="fp">'+p+'%</span>':'')+'</div><div class="bar thin"><i style="width:'+p+'%"></i></div><span class="hint">'+boardLines(b).length+'/8 bingo lines</span></button>';
  });
  return h+'<button class="folder new" data-act="modal" data-v="newBoard">+ New vision board</button></div></section>';
}

function vYear(){

function rangeBounds(r,off){
  var t=today(), cy=t.slice(0,7), n;
  if(r==="7d"||r==="30d"){n=r==="7d"?7:30; var e=addDays(t,-n*off); return [addDays(e,-(n-1)),e]}
  if(r==="month"){var ym=shiftMonth(cy,-off); return [ym+"-01", ym+"-"+pad(Math.min(+t.slice(8),daysIn(ym)))]}
  n=r==="6m"?6:12; var eym=shiftMonth(cy,-n*off), sym=shiftMonth(eym,-(n-1));
  return [sym+"-01", off?eym+"-"+pad(daysIn(eym)):t];
}
function prevLabel(r){return {"month":"the same days last month","7d":"the previous 7 days","30d":"the previous 30 days","6m":"the previous 6 months","12m":"the previous 12 months"}[r]}
function delta(cur,prev,goodUp){
  if(!prev&&!cur) return '<span class="dl">no change</span>';
  if(!prev) return '<span class="dl">no prior data</span>';
  var p=Math.round((cur-prev)/Math.abs(prev)*100); if(p===0) return '<span class="dl">no change</span>';
  var good=(p>0)===goodUp; return '<span class="dl '+(good?"up":"bad")+'">'+(p>0?"▲ ":"▼ ")+Math.abs(p)+'%</span>';
}

  var spentBefore=txSum(ym+"-01",addDays(d,-1))[1], left=daysIn(ym)-pd(d).getDate()+1;

}
